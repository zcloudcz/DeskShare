<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b72d9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DeskShare">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <title>DeskShare</title>
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <header class="header">
        <a class="brand" href="index.html"><img class="brand-icon" src="icons/viewer.svg" alt="" width="40" height="40">DeskShare</a>
        <button id="showPanelsBtn" onclick="setFocus(false)" data-i18n="web.show"></button>
        <div class="header-actions">
            <span id="accountBar" hidden><span id="accountName"></span> <button id="signInBtn" class="secondary" data-i18n="web.signin"></button></span>
            <label for="languageSelect" data-i18n="language.label"></label><select id="languageSelect"></select>
        </div>
    </header>
    <main class="container">
        <div class="start-layout">
            <section class="intro">
                <p class="eyebrow" data-i18n="web.browser"></p>
                <h1 data-i18n="home.give"></h1>
                <p class="lead" data-i18n="web.intro"></p>
                <ol class="steps">
                    <li data-i18n="web.step1"></li>
                    <li data-i18n="home.give_hint"></li>
                    <li data-i18n="web.step3"></li>
                </ol>
                <p class="download"><span data-i18n="home.need"></span><br><a data-download data-i18n="web.download" href="https://deskshare.zcloud.cz/"></a></p>
            </section>
            <section class="controls">
                <form id="connectForm">
                    <h2 data-i18n="web.connection"></h2>
                    <div class="control-group">
                        <label for="serverId" data-i18n="number.theirs"></label>
                        <div class="input-row"><bdi dir="ltr"><input type="text" id="serverId" inputmode="numeric" placeholder="123 456 789" autocomplete="off" aria-describedby="numberHint"></bdi></div>
                        <p id="numberHint" class="hint" data-i18n="web.number_hint"></p>
                    </div>
                    <div class="control-group">
                        <label for="passkey" id="secretLabel" data-i18n="code.label"></label>
                        <div class="input-row"><bdi dir="ltr"><input type="text" id="passkey" placeholder="ABC-234-XYZ" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="codeHint"></bdi></div>
                        <p id="codeHint" class="hint" data-i18n="web.code_hint"></p>
                    </div>
                    <button id="connectBtn" type="submit" data-i18n="connect.action"></button>
                    <p class="consent" data-i18n="web.consent"></p>
                </form>
                <div id="sessionTools" class="session-tools">
                <button id="disconnectBtn" onclick="disconnect()" disabled data-i18n="connect.leave">connect.leave</button>
                <button id="fullscreenBtn" onclick="toggleFullscreen()" disabled data-i18n="view.fullscreen">view.fullscreen</button>
                <button id="controlBtn" onclick="toggleControl()" disabled data-i18n="control.request">control.request</button>
                <button id="ctrlAltDelBtn" onclick="sendCtrlAltDel()" disabled>Ctrl+Alt+Del</button>
                <!-- Shown only when the host allowed the privacy screen and control is active (see updatePrivacyButton in client.js). -->
                <button id="privacyBtn" onclick="togglePrivacy()" hidden data-i18n="web.privacy">web.privacy</button>
                <!-- Shown only when the host has several displays and control is active (see updateDisplayPicker in client.js). -->
                <label id="displayPicker" hidden><span data-i18n="web.display"></span> <select id="displaySelect" onchange="switchDisplay(this.value)"></select></label>
                <!-- Shown only when the host allowed clipboard sharing (see setClipboardAllowed in client.js). -->
                <button id="sendClipboardBtn" onclick="sendClipboard()" hidden data-i18n="web.sendtext">web.sendtext</button>
                <button id="copyHostClipboardBtn" onclick="copyHostClipboard()" hidden disabled data-i18n="web.copytext">web.copytext</button>
                <!-- Shown only when the host allowed receiving files (see setFilesAllowed in client.js). A file can also be dropped on the video. -->
                <button id="sendFileBtn" onclick="onSendFileClick()" hidden data-i18n="web.file">web.file</button>
                <input type="file" id="fileInput" hidden>
                <!-- Shown once a verified session shows video (see showVideo in client.js). The host is told while recording. -->
                <button id="recordBtn" onclick="toggleRecording()" hidden data-i18n="web.record">web.record</button>
                <span id="recIndicator" hidden style="color:#c00;font-weight:bold"></span>
                <button id="hidePanelsBtn" onclick="setFocus(true)" data-i18n="view.hide_tools">view.hide_tools</button>

                </div>
                <div id="status" class="status info" role="status" aria-live="polite" style="display:none"><span id="statusText"></span></div>
                <details id="connectionDetails"><summary data-i18n="connection.details"></summary>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.connection"></div>
                    <div class="stat-value" id="connectionState" data-i18n="web.disconnected"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.client"></div>
                    <div class="stat-value" id="clientId" style="font-size: 16px;">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.rtc"></div>
                    <div class="stat-value" id="webrtcState">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.bitrate"></div>
                    <div class="stat-value" id="bitrate">- Kbps</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.fps"></div>
                    <div class="stat-value" id="fps">- fps</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.loss"></div>
                    <div class="stat-value" id="packetLoss">-%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.latency"></div>
                    <div class="stat-value" id="latency">- ms</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.route"></div>
                    <div class="stat-value" id="connectionType">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="web.resolution"></div>
                    <div class="stat-value" id="resolution">-</div>
                </div>
            </div>

                </details>
            </section>
        </div>
        <footer><span>DeskShare · <span data-i18n="web.noaccount"></span></span>
            <details id="advanced"><summary data-i18n="advanced.label"></summary>
                <div class="advanced-content">
                    <label class="checkbox"><input id="passwordMode" type="checkbox"><span data-i18n="web.password"></span></label>
                    <p class="hint" data-i18n="web.password_hint"></p>
                    <label for="signalingUrl" data-i18n="web.service"></label>
                    <input type="url" id="signalingUrl" value="wss://localhost:5151/signal" dir="ltr">
                    <div id="myDevicesPanel" hidden><strong data-i18n="web.devices"></strong><button id="refreshDevicesBtn" data-i18n="web.refresh"></button><ul id="myDevicesList"></ul><small id="myDevicesStatus" role="status"></small></div>
                </div>
            </details>
        </footer>
        <div class="video-container" id="videoContainer" dir="ltr">
            <video id="remoteVideo" autoplay playsinline></video>
            <div id="placeholder" class="placeholder" data-i18n="web.idle"></div>
        </div>
    </main>
    <script src="i18n.js"></script>
    <script src="remote-control.js"></script>
    <script src="bind-gate.js"></script>
    <script src="client.js"></script>
    <script src="accounts.js"></script>
    <script src="viewer-ui.js"></script>
</body>
</html>
