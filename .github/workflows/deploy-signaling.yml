# Deploys the SignalingServer (+ WebClient) to Azure App Service "deskshare-signaling"
# (app.deskshare.zcloud.cz). Runs on every push to main that touches the server or its dependencies.
# Auth: GitHub OIDC → Entra app "deskshare-github-deploy" (federated credential for refs/heads/main,
# role Website Contributor on the web app). Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# SCM basic auth stays disabled on the App Service, so publish profiles are not used.

name: Deploy signaling server

on:
  push:
    branches: [ main ]
    paths:
      - 'src/SignalingServer/**'
      - 'src/Core/**'
      - 'src/Common/**'
      - 'src/Stun/**'
      - 'src/Turn/**'
      - 'src/WebClient/**'
      - '.github/workflows/deploy-signaling.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish SignalingServer
        run: dotnet publish src/SignalingServer/DeskShare.SignalingServer.csproj -c Release -o publish

      # Program.cs serves ./WebClient (next to the binaries) under /webclient
      - name: Add WebClient
        run: cp -r src/WebClient publish/WebClient

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: deskshare-signaling
          package: publish
