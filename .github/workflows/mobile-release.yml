# Signed store builds of the Flutter app (mobile/), started by hand.
#   Android: "play" AAB (no remote control, see android/app/build.gradle.kts) -> Google Play, and the "full" APK
#            (with remote control) -> artifact and optionally a GitHub release.
#   iOS:     signed IPA -> TestFlight.
# Each upload is off until its repo variable is 'true' (PLAY_UPLOAD_ENABLED, IOS_SIGNING_ENABLED,
# TESTFLIGHT_ENABLED), so the workflow can run before every store account is set up.
# The build number is the run number: both stores need it to grow with every upload.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release to attach the full APK to (empty = artifact only)'
        required: false
        type: string
      play_track:
        description: 'Google Play track'
        required: false
        default: internal
        type: choice
        options: [ internal, alpha, beta, production ]

permissions:
  contents: write   # gh release upload

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
          cache: true

      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo 'Missing secret ANDROID_KEYSTORE_BASE64' >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "DESKSHARE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Play bundle and full APK
        env:
          DESKSHARE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DESKSHARE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DESKSHARE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build appbundle --release --flavor play --build-number=${{ github.run_number }}
          flutter build apk --release --flavor full --build-number=${{ github.run_number }}
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          mkdir -p ../dist
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "../dist/DeskShare-$version-play.aab"
          cp build/app/outputs/flutter-apk/app-full-release.apk "../dist/DeskShare-$version-android.apk"
          echo "Android $version (${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: vars.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cz.zcloud.deskshare
          releaseFiles: dist/*-play.aab
          track: ${{ inputs.play_track }}
          # 'draft' until the app's first release is published in Play Console (Play rejects 'completed' before).
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Attach APK to GitHub release
        if: inputs.release_tag != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*-android.apk --clobber

  ios:
    if: vars.IOS_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
          cache: true

      - name: Build signed IPA
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || 'DZR3FD9ZNT' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/mobile/build-ios-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        if: vars.TESTFLIGHT_ENABLED == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: bash scripts/mobile/upload-testflight.sh
