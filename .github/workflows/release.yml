# Release: build the Windows desktop app, package it with Velopack and publish a GitHub Release.
# Triggered by pushing a version tag (v1.2.3). The landing page links to
# https://github.com/zcloudcz/DeskShare/releases/latest/download/DeskShare-win-Setup.exe
# so every tag automatically becomes the download offered on deskshare.zcloud.cz.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # vpk upload creates the GitHub Release and uploads assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Version comes from the tag: v1.2.3 → 1.2.3
      - name: Resolve version
        id: version
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Restore dependencies
        run: dotnet restore DeskShare.sln

      - name: Build solution
        run: dotnet build DeskShare.sln --configuration Release --no-restore

      # WindowsInputController tests call SendInput on a real desktop session and are flaky on hosted runners.
      - name: Run tests
        run: dotnet test DeskShare.sln --configuration Release --no-build --filter "FullyQualifiedName!~WindowsInputController"

      # FFmpeg 8.1 LGPL shared DLLs (video decoding in the viewer); not in git because of size.
      - name: Download FFmpeg
        shell: pwsh
        run: ./src/DeskShare.Desktop/download-ffmpeg.ps1

      # Framework-dependent publish; Velopack's Setup.exe installs the .NET 8 desktop runtime if missing
      # (see --framework below). Keeps the installer ~90 MB instead of ~170 MB.
      - name: Publish desktop app
        run: dotnet publish src/DeskShare.Desktop/DeskShare.Desktop.csproj -c Release -r win-x64 --self-contained false -o publish -p:Version=${{ steps.version.outputs.version }}

      - name: Add FFmpeg to publish output
        shell: pwsh
        run: Copy-Item -Path src/DeskShare.Desktop/ffmpeg -Destination publish/ffmpeg -Recurse

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Pack with Velopack
        run: >
          vpk pack
          --packId DeskShare
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe DeskShare.exe
          --packTitle DeskShare
          --packAuthors "Martin Zahálka"
          --icon src/DeskShare.Desktop/deskshare.ico
          --framework net8.0-x64-desktop
          --outputDir Releases

      # Produces DeskShare-win-Setup.exe, DeskShare-win-Portable.zip, the .nupkg and releases.win.json
      # (releases.win.json is what the installed app checks for auto-updates).
      - name: Upload to GitHub Release
        run: >
          vpk upload github
          --outputDir Releases
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --releaseName "DeskShare ${{ github.ref_name }}"
          --publish
