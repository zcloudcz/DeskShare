# Release Pipeline: Build and Publish
# Triggered when a version tag (v*) is pushed (e.g., v1.0.0).
# Builds a self-contained portable package for win-x64 and creates a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install .NET 8 SDK
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Step 3: Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore DeskShare.sln

      # Step 4: Build the entire solution to ensure everything compiles
      - name: Build solution
        run: dotnet build DeskShare.sln --configuration Release --no-restore

      # Step 5: Run tests before releasing (fail fast if tests break)
      - name: Run tests
        run: dotnet test DeskShare.sln --configuration Release --no-build --logger trx --results-directory TestResults

      # Step 6: Publish SignalingServer as a self-contained win-x64 application
      # --self-contained bundles the .NET runtime so no SDK is needed on target machine
      - name: Publish SignalingServer (win-x64)
        run: dotnet publish src/SignalingServer/DeskShare.SignalingServer.csproj -c Release -r win-x64 --self-contained -o publish/SignalingServer

      # Step 7: Copy WebClient files into the publish output for static file serving
      - name: Copy WebClient
        run: |
          Copy-Item -Path src/WebClient -Destination publish/SignalingServer/WebClient -Recurse

      # Step 8: Create a ZIP archive of the published output
      - name: Create release archive
        run: |
          Compress-Archive -Path publish/SignalingServer/* -DestinationPath DeskShare-SignalingServer-win-x64.zip

      # Step 9: Create a GitHub Release and attach the ZIP artifact
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeskShare-SignalingServer-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
