# RemoteDesktop.NET TURN Server Configuration
# Based on coturn (https://github.com/coturn/coturn)

# Listening ports
listening-port=3478
tls-listening-port=5349
# For alternative ports: alt-listening-port=3479, alt-tls-listening-port=5350

# External IP (auto-detect or specify manually)
# external-ip=YOUR_PUBLIC_IP_HERE
# If behind NAT, specify both:
# external-ip=PUBLIC_IP/PRIVATE_IP

# Relay ports range (for media streams)
min-port=49152
max-port=65535

# Realm (must match client configuration)
realm=remotedesktop.net
server-name=remotedesktop.net

# Authentication
# Credentials are provided via environment variables (TURN_USER, TURN_PASSWORD)
# DO NOT hardcode credentials here. Set them in docker-compose.yml or .env file.
# user=<set-via-env>
lt-cred-mech

# TLS/DTLS certificates (required for production)
# Generate with: openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes
# Or use Let's Encrypt certificates
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/key.pem

# Fingerprints for DTLS
# fingerprint

# Security settings
# Deny private IP ranges (recommended for public servers)
# no-loopback-peers
# no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Logging
verbose
log-file=/var/log/coturn/turnserver.log
log-binding

# Performance tuning
# max-bps=1000000  # 1 Mbps per session
# bps-capacity=0   # Unlimited total
# total-quota=100  # Max 100 sessions

# Quota and rate limiting
# user-quota=10    # Max 10 sessions per user
# stale-nonce=600  # Nonce lifetime (seconds)

# Mobility/ICE settings
mobility
# no-stun-backward-compatibility
# response-origin-only-with-rfc5780

# Database (for dynamic credentials - optional)
# For Redis:
# redis-userdb="ip=127.0.0.1 dbname=0 password=PASSWORD connect_timeout=30"
# redis-statsdb="ip=127.0.0.1 dbname=1 password=PASSWORD connect_timeout=30"

# CLI access disabled in production (security risk)
no-cli

# Prometheus metrics (optional)
# prometheus
# prometheus-port=9641

# Additional options
# no-cli
# no-tlsv1
# no-tlsv1_1
# no-dtls
# no-udp
# no-tcp
# no-tls

# Allowed/denied peer IPs (whitelist specific ranges if needed)
# allowed-peer-ip=192.168.1.0-192.168.1.255

# Turn off for production (development only)
# no-auth
# Uncomment for testing without authentication (NOT RECOMMENDED)
